# Graphical interface through the host's X11 (Linux). First: xhost +local:docker
# For headless runs, use docker run directly (see readme.md).
services:
  terrame:
    build: .
    image: terrame-luccme:latest
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./models:/work
    # Same entrypoint as the image, redeclared to drop the default CMD (-version):
    # with no arguments, TerraME opens its graphical launcher.
    entrypoint: ["/usr/bin/dumb-init", "--", "/usr/local/bin/terrame-entrypoint"]
    network_mode: host
    # With a GPU on the host, uncomment:
    # devices:
    #   - /dev/dri:/dev/dri
