services:
  terrame:
    build: .
    image: terrame-custom:latest
    container_name: terrame_app
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1      # ← forçar software rendering
      - QT_X11_NO_MITSHM=1          # ← desabilitar shared memory X11
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
      - ./models:/root/models   # ← era /opt/terrame/models
    network_mode: host
    # privileged: true  # evitar se possível, prefira device abaixo
    devices:
      - /dev/dri:/dev/dri  # acesso à GPU para OpenGL