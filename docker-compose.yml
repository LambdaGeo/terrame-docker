services:
  terrame:
    build: .
    image: terrame-custom:latest
    container_name: terrame_app
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./modelos:/opt/terrame/models
    network_mode: host
    privileged: true
    # Comando de teste: apenas ver a versão e sair
    command: ["-v"]