# Interface gráfica usando o X11 do host (Linux). Antes: xhost +local:docker
# Para rodar sem tela, use docker run direto (ver dockerfile).
services:
  terrame:
    build: .
    image: terrame-luccme:latest
    environment:
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./models:/work
    network_mode: host
    # Com GPU disponível no host, descomente:
    # devices:
    #   - /dev/dri:/dev/dri
